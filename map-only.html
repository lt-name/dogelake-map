<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <script src="assets/js/must-not-https.js"></script>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="https://cdn.staticfile.net/openlayers/8.2.0/ol.css">
    <link rel="stylesheet" href="assets/css/map/better-openlayers.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>DogeLake | 地图纯净版</title>
</head>
<body style="background:#000">

<div id="map" style="width:100vw;height:100vh"></div>

<!-- JavaScript -->
<script src="config.js"></script>
<script src="assets/js/map/openlayers.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/5.2.0/js/bootstrap.min.js"></script>
<script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
<script>
    // 从URL获取world参数
    const urlParams = new URLSearchParams(window.location.search);
    const worldParam = urlParams.get('world') || 'world';

    // 动态加载unmined地图配置文件
    const mapOnlyBackendUrl = CONFIG.mapOnlyBackend;
    document.write('<script src="' + mapOnlyBackendUrl + '/unmined.map.properties.js?world=' + encodeURIComponent(worldParam) + '"><\/script>');
    document.write('<script src="' + mapOnlyBackendUrl + '/unmined.map.regions.js?world=' + encodeURIComponent(worldParam) + '"><\/script>');
</script>
<script src="assets/js/map/custom.markers.js"></script>
<script src="assets/js/map/openlayers-fix.js"></script>
<script src="assets/js/map/openlayers-layerswitcher.js"></script>
<script src="assets/js/map/unmined.openlayers.js"></script>
<script src="assets/js/map/init-map.js"></script>
</body>
</html>
